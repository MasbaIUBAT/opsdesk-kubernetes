  name: opsdesk-api
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: opsdesk-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opsdesk-api
  ports:
