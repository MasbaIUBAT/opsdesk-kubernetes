apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsdesk-api
  namespace: opsdesk
  labels:
    app.kubernetes.io/name: opsdesk-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opsdesk-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsdesk-api
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: opsdesk-api
          image: opsdesk-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000